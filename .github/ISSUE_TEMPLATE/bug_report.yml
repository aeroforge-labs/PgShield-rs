# --------------------------------------------------------------------------------------------------------------------                                                                                                                                                                                #*eddiere
name: Bug Report
description: Create a report to help us fix a bug or issue in PgShield
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the fields below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'pgshield --listen-addr 0.0.0.0:6432'
        2. Execute query '...'
        3. Observe unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Details about your OS, Rust version, PostgreSQL backend version, and PgShield version.
      value: |
        - PgShield Version: v0.1.0
        - OS: 
        - PostgreSQL Backend Version: 
        - Rust Version (if building from source): 
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs & Output
      description: Copy and paste any relevant logs, terminal output, or stack traces.
      render: shell
    validations:
      required: false
