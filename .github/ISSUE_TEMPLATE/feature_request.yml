# --------------------------------------------------------------------------------------------------------------------                                                                                                                                                                                #*eddiere
name: Feature Request
description: Suggest an idea or new capability for PgShield
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for PgShield! Please describe your proposed capability below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear description of the problem or limitation this feature addresses.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of the feature or behavior you would like added.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have evaluated.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional context, architecture notes, or query examples.
    validations:
      required: false
