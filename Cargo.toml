[package]
name = "pgshield"
version = "0.1.0"
edition = "2021"
authors = ["eddiere"]
description = "Asynchronous PostgreSQL Wire Protocol Proxy, Multiplexer & Query Firewall in Rust"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.7"
futures = "0.3"
sqlparser = "0.50"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
