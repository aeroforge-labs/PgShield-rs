version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_primary
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgshield-proxy:
    build: .
    container_name: pgshield_proxy
    environment:
      PGSHIELD_LISTEN_ADDR: "0.0.0.0:6432"
      POSTGRES_BACKEND_HOST: "postgres-db"
      POSTGRES_BACKEND_PORT: "5432"
      POOL_MAX_SIZE: "50"
      FIREWALL_STRICT_MODE: "true"
      FIREWALL_REQUIRE_WHERE: "true"
      FIREWALL_BLOCK_DDL: "true"
    ports:
      - "6432:6432"
    depends_on:
      postgres-db:
        condition: service_healthy
